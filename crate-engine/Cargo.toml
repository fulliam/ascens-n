[package]
name = "ecs-core"
version = "0.2.0"
edition = "2021"
description = "High-performance ECS engine for browser/WASM with SoA storage"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
smallvec = "1.15"
thiserror = "2"
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }

# WASM-only — версии совместимые с rustc 1.75+
wasm-bindgen = { version = "=0.2.92", optional = true }
js-sys       = { version = "=0.3.69", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "js-sys"]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
